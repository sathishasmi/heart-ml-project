<!DOCTYPE html>
<html>
<head>
    <title>Heart Disease Prediction</title>
</head>
<body>
    <h2>Heart Disease Prediction Form</h2>

    <form action="/predict_form" method="post">
        Age (20 - 80): <input type="number" name="age" min="20" max="80"><br><br>

        Sex (0 - 1): <input type="number" name="sex" min="0" max="1"><br><br>

        CP (0 - 3): <input type="number" name="cp" min="0" max="3"><br><br>

        Trestbps (90 - 200): <input type="number" name="trestbps" min="90" max="200"><br><br>

        Chol (100 - 400): <input type="number" name="chol" min="100" max="400"><br><br>

        FBS (0 - 1): <input type="number" name="fbs" min="0" max="1"><br><br>

        Restecg (0 - 2): <input type="number" name="restecg" min="0" max="2"><br><br>

        Thalach (70 - 210): <input type="number" name="thalach" min="70" max="210"><br><br>

        Exang (0 - 1): <input type="number" name="exang" min="0" max="1"><br><br>

        Oldpeak (0 - 6): <input type="number" step="0.1" name="oldpeak" min="0" max="6"><br><br>

        Slope (0 - 2): <input type="number" name="slope" min="0" max="2"><br><br>

        CA (0 - 3): <input type="number" name="ca" min="0" max="3"><br><br>

        Thal (1 - 3): <input type="number" name="thal" min="1" max="3"><br><br>

        <button type="submit">Predict</button>
    </form>

    <h3>{{ prediction }}</h3>

</body>
</html>
